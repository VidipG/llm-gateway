[project]
name = "llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic[aiohttp]>=0.52.0",
    "fastapi>=0.135.1",
    "google-genai",
    "ollama>=0.4.8",
    "pydantic-settings>=2.7.0",
    "fastembed>=0.3.0",
    "semantic-router>=0.1.12",
    "uvicorn>=0.42.0",
    "coverage>=7.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
