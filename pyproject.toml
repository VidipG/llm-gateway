[project]
name = "llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic[aiohttp]==0.87.0",
    "fastapi==0.135.1",
    "google-genai==1.68.0",
    "ollama==0.6.1",
    "pydantic-settings==2.13.1",
    "fastembed==0.8.0",
    "semantic-router==0.1.12",
    "uvicorn==0.42.0",
    "redisvl==0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
